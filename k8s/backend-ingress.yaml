apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fylo-ingress
  namespace: fylo
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"        # streaming uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # long transfers
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket upgrade for /ws/events on the websocket port.
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.fylo.app, fylo.app]
      secretName: fylo-tls
  rules:
    - host: api.fylo.app
      http:
        paths:
          - path: /ws/events
            pathType: Prefix
            backend:
              service: { name: backend-service, port: { number: 9091 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend-service, port: { number: 9090 } }
    - host: fylo.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend-service, port: { number: 9090 } }
